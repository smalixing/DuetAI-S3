version: "0.1.0"
description: Espressif JoyInside voice chat SDK based on WebSocket
dependencies:
  espressif/esp_websocket_client: ">=1.7.0"
  espressif/cjson:
    version: "^1.7.19"
    rules:
      - if: "idf_version >=6.0"
targets:
  - esp32
  - esp32s3
  - esp32s2
  - esp32p4
  - esp32c3
  - esp32c6
  - esp32c5
  - esp32s31
examples:
  - path: examples/joyinside_ws_app
  - path: examples/joyinside_basic_test
